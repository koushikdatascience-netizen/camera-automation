<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Camera Eye Login</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f6f7f9;color:#172033}.wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(480px,100%);background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:32px;box-shadow:0 20px 60px #10182812}.brand{font-weight:850;font-size:25px}.sub{color:#667085;margin:7px 0 26px}.step{font-size:12px;font-weight:800;color:#9a6700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}label{display:block;font-size:13px;font-weight:650;margin:14px 0 7px}input,select{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:10px;background:#fff;font:inherit}.submit{width:100%;margin-top:20px;padding:13px;border:0;border-radius:10px;background:#fbbf24;font-weight:850;cursor:pointer}.secondary{background:#f2f4f7;margin-top:10px}.msg{margin-top:14px;color:#b42318;font-size:13px}.hidden{display:none}.hint{font-size:12px;color:#667085;margin-top:8px}.summary{background:#f9fafb;border:1px solid #eaecf0;border-radius:10px;padding:12px;margin:12px 0;font-size:13px}.legacy{margin-top:22px;padding-top:18px;border-top:1px solid #eaecf0}.link{border:0;background:none;color:#475467;text-decoration:underline;cursor:pointer;padding:0}
</style></head><body><div class="wrap"><div class="card">
<div class="brand">SnapKey Camera Eye</div><div class="sub">Secure camera intelligence portal</div>
<section id="clientStep"><div class="step">Step 1 of 3</div><form id="clientForm"><label>Client ID</label><input id="clientId" autocomplete="organization" placeholder="Enter your Client ID" required><div class="hint">Use the Client ID assigned to your organization.</div><button class="submit">Continue</button></form></section>
<section id="choiceStep" class="hidden"><div class="step">Step 2 of 3</div><div id="clientSummary" class="summary"></div><form id="choiceForm"><label>User</label><select id="userId" required></select><label>Site / Counter</label><select id="shopCode" required></select><button class="submit">Continue</button><button type="button" id="backClient" class="submit secondary">Back</button></form></section>
<section id="passwordStep" class="hidden"><div class="step">Step 3 of 3</div><div id="loginSummary" class="summary"></div><form id="passwordForm"><label>Password</label><input id="password" type="password" autocomplete="current-password" required><button class="submit">Open Camera Eye</button><button type="button" id="backChoice" class="submit secondary">Back</button></form></section>
<div id="msg" class="msg"></div>
<div class="legacy"><button id="legacyToggle" class="link" type="button">Use legacy email login</button><form id="legacyForm" class="hidden"><label>Email</label><input id="email" type="email"><label>Password</label><input id="legacyPassword" type="password"><button class="submit">Login</button></form></div>
</div></div><script>
const $=id=>document.getElementById(id),msg=$("msg");let options=null;
function show(id){["clientStep","choiceStep","passwordStep"].forEach(x=>$(x).classList.toggle("hidden",x!==id));msg.textContent=""}
async function post(url,body){const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});let x={};try{x=await r.json()}catch{}if(!r.ok)throw Error(typeof x.detail==="string"?x.detail:"Request failed");return x}
function finish(x){sessionStorage.setItem("snapkey_portal_session",x.token);location.href="/portal"}
$("clientForm").onsubmit=async e=>{e.preventDefault();msg.textContent="";try{options=await post("/auth/client/options",{client_id:$("clientId").value.trim()});if(!options.users.length||!options.sites.length)throw Error("No Camera Eye users or sites are configured for this Client ID.");$("userId").innerHTML=options.users.map(x=>'<option value="'+x.id+'">'+x.display_name+'</option>').join("");$("shopCode").innerHTML=options.sites.map(x=>'<option value="'+x.shop_id+'">'+x.name+'</option>').join("");$("clientSummary").textContent="Client: "+$("clientId").value.trim();show("choiceStep")}catch(x){msg.textContent=x.message}};
$("choiceForm").onsubmit=e=>{e.preventDefault();const u=$("userId").options[$("userId").selectedIndex].text,s=$("shopCode").options[$("shopCode").selectedIndex].text;$("loginSummary").textContent=u+" • "+s;show("passwordStep");$("password").focus()};
$("passwordForm").onsubmit=async e=>{e.preventDefault();msg.textContent="";try{finish(await post("/auth/client/login",{client_id:$("clientId").value.trim(),user_id:$("userId").value,shop_code:$("shopCode").value,password:$("password").value}))}catch(x){msg.textContent=x.message}};
$("backClient").onclick=()=>show("clientStep");$("backChoice").onclick=()=>show("choiceStep");
$("legacyToggle").onclick=()=>$("legacyForm").classList.toggle("hidden");
$("legacyForm").onsubmit=async e=>{e.preventDefault();try{finish(await post("/auth/login",{email:$("email").value,password:$("legacyPassword").value}))}catch(x){msg.textContent=x.message}};
</script></body></html>
