<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Camera Eye Login</title><style>
body{margin:0;font-family:Arial,sans-serif;background:#f7f7f2;color:#172033}.wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(440px,100%);background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:32px;box-shadow:0 18px 50px #00000012}.brand{font-weight:800;font-size:24px}.sub{color:#667085;margin:7px 0 25px}.tabs{display:flex;gap:8px;margin-bottom:18px}.tabs button{flex:1;border:0;padding:11px;border-radius:9px;cursor:pointer}.active{background:#fbbf24!important;font-weight:700}label{display:block;font-size:13px;margin:12px 0 6px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d0d5dd;border-radius:9px}.submit{width:100%;margin-top:20px;padding:13px;border:0;border-radius:9px;background:#fbbf24;font-weight:800;cursor:pointer}.msg{margin-top:14px;color:#b42318}.hidden{display:none}.hint{font-size:12px;color:#667085;margin-top:8px}</style></head>
<body><div class="wrap"><div class="card"><div class="brand">SnapKey Camera Eye</div><div class="sub">Secure camera intelligence portal</div>
<div class="tabs"><button id="loginTab" class="active">Login</button><button id="registerTab">Create account</button></div>
<form id="loginForm"><label>Email</label><input id="le" type="email" required><label>Password</label><input id="lp" type="password" required><button class="submit">Login</button></form>
<form id="registerForm" class="hidden"><label>Your name</label><input id="rn" required><label>Email</label><input id="re" type="email" required><label>Password</label><input id="rp" type="password" minlength="8" required><label>Company Code</label><input id="rc" placeholder="snapkey" required><label>Shop Code</label><input id="rs" placeholder="demo-shop" required><div class="hint">Use the same Company Code and Shop Code used to activate the Camera Eye PC.</div><button class="submit">Create Camera Eye account</button></form><div id="msg" class="msg"></div>
</div></div><script>
const $=id=>document.getElementById(id), msg=$("msg");
function mode(register){$("loginForm").classList.toggle("hidden",register);$("registerForm").classList.toggle("hidden",!register);$("loginTab").classList.toggle("active",!register);$("registerTab").classList.toggle("active",register);msg.textContent=""}
$("loginTab").onclick=()=>mode(false);$("registerTab").onclick=()=>mode(true);
async function submit(url,body){msg.textContent="";const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const x=await r.json();if(!r.ok)throw Error(x.detail||"Request failed");sessionStorage.setItem("snapkey_portal_session",x.token);location.href="/portal";}
$("loginForm").onsubmit=async e=>{e.preventDefault();try{await submit("/auth/login",{email:$("le").value,password:$("lp").value})}catch(x){msg.textContent=x.message}};
$("registerForm").onsubmit=async e=>{e.preventDefault();try{await submit("/auth/register",{display_name:$("rn").value,email:$("re").value,password:$("rp").value,company_code:$("rc").value,shop_code:$("rs").value})}catch(x){msg.textContent=x.message}};
</script></body></html>
