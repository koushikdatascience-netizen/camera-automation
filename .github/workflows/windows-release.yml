name: Camera Eye Windows Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified installer to production auto-update registry
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: camera-eye-windows-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      SNAPKEY_ENV: development
      SNAPKEY_DATABASE_URL: ''
      CAMERA_AUTOMATION_HOME: ${{ github.workspace }}/data/ci-edge
      CAMERA_AUTOMATION_CONFIG: ${{ github.workspace }}/data/ci-edge/missing.yaml
      SNAPKEY_PORTAL_DB: ${{ github.workspace }}/data/ci-portal.db
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install -r requirements-ci.txt
      - run: python -m compileall -q camera_service cloud_portal tools
      - run: python -m pytest tests -q
      - run: python test_production_package.py

  windows-installer:
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          lfs: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install production and packaging dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Install and verify supported CPU TorchVision build
        shell: pwsh
        run: |
          # requirements.txt installs whichever torch/torchvision satisfy the
          # broad Ultralytics constraints. Pin the tested Windows CPU pair so
          # the frozen edge app always contains the native torchvision ops.
          python -m pip install --force-reinstall --no-deps `
            --index-url https://download.pytorch.org/whl/cpu `
            "torch==2.13.0+cpu" "torchvision==0.28.0+cpu"
          if ($LASTEXITCODE -ne 0) { throw "Unable to install the supported CPU Torch/TorchVision wheels." }
          python -c "import torch, torchvision; from torchvision.extension import _has_ops; assert _has_ops(), 'TorchVision native operators failed to load'; boxes=torch.tensor([[0.,0.,10.,10.],[1.,1.,9.,9.]]); scores=torch.tensor([0.9,0.8]); assert torchvision.ops.nms(boxes,scores,0.5).tolist()==[0]; print(f'Verified torch={torch.__version__}, torchvision={torchvision.__version__}, native NMS=available')"
          if ($LASTEXITCODE -ne 0) { throw "TorchVision native NMS verification failed." }
      - name: Prepare offline InsightFace model bundle
        shell: pwsh
        run: |
          python -c "from insightface.app import FaceAnalysis; FaceAnalysis(name='buffalo_l', providers=['CPUExecutionProvider'])"
          $model = Join-Path $HOME ".insightface\models\buffalo_l"
          foreach ($name in @("det_10g.onnx", "w600k_r50.onnx")) {
            if (-not (Test-Path (Join-Path $model $name))) { throw "Missing InsightFace model: $name" }
          }
      - name: Ensure Inno Setup 6 is available
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
      - name: Build and verify production Windows installer
        shell: pwsh
        run: .\packaging\windows\build_installer.ps1
      - name: Version installer and generate SHA256
        shell: pwsh
        run: |
          $short = $env:GITHUB_SHA.Substring(0, 12)
          $source = "dist\installer\MadhushalaCameraAISetup.exe"
          $versioned = "dist\installer\MadhushalaCameraAISetup-$short.exe"
          Copy-Item $source $versioned
          $sha = (Get-FileHash $versioned -Algorithm SHA256).Hash.ToLower()
          $sha | Set-Content "dist\installer\MadhushalaCameraAISetup-$short.sha256"
          "Installer: MadhushalaCameraAISetup-$short.exe" >> $env:GITHUB_STEP_SUMMARY
          "Version: 1.0.$env:GITHUB_RUN_NUMBER" >> $env:GITHUB_STEP_SUMMARY
          "Commit: $env:GITHUB_SHA" >> $env:GITHUB_STEP_SUMMARY
          "SHA256: $sha" >> $env:GITHUB_STEP_SUMMARY
      - name: Upload verified Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: camera-eye-windows-installer-${{ github.sha }}
          path: |
            dist/installer/MadhushalaCameraAISetup-*.exe
            dist/installer/MadhushalaCameraAISetup-*.sha256
          if-no-files-found: error
          retention-days: 14

  publish-edge-update:
    needs: windows-installer
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://camera.snapkey.ai
    env:
      UPDATE_PUBLISH_KEY: ${{ secrets.CAMERA_UPDATE_PUBLISH_KEY }}
    steps:
      - name: Download verified Windows installer
        uses: actions/download-artifact@v4
        with:
          name: camera-eye-windows-installer-${{ github.sha }}
          path: dist/installer
      - name: Publish installer to Camera Eye update registry
        shell: bash
        run: |
          set -euo pipefail
          : "${UPDATE_PUBLISH_KEY:?Missing CAMERA_UPDATE_PUBLISH_KEY}"
          installer=$(find dist/installer -maxdepth 1 -name 'MadhushalaCameraAISetup-*.exe' -print -quit)
          [[ -n "$installer" ]]
          sha=$(sha256sum "$installer" | awk '{print $1}')
          version="1.0.${GITHUB_RUN_NUMBER}"
          curl --fail-with-body --retry 3 --max-time 600 \
            -H "X-Update-Publish-Key: $UPDATE_PUBLISH_KEY" \
            -F "file=@$installer;type=application/octet-stream" \
            "https://camera.snapkey.ai/internal/v1/edge-updates/publish?version=$version&build_id=$GITHUB_SHA&sha256=$sha"
          echo "Published Camera Eye edge $version ($GITHUB_SHA)" >> "$GITHUB_STEP_SUMMARY"
