name: Camera Eye Cloud Deploy

on:
  push:
    branches:
      - feat/camera-eye-live-view-ux
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: camera-eye-production-cloud
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: isolated-ci-password
          POSTGRES_DB: camera_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d camera_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Create disposable PostgreSQL integration database
        run: |
          python - <<'PY'
          from sqlalchemy import create_engine, text
          engine = create_engine("postgresql+psycopg://ci:isolated-ci-password@127.0.0.1:5432/camera_ci")
          with engine.connect().execution_options(isolation_level="AUTOCOMMIT") as connection:
              connection.execute(text("CREATE DATABASE camera_eye_test"))
          engine.dispose()
          PY
      - name: Validate cloud code
        env:
          SNAPKEY_TEST_DATABASE_URL: postgresql+psycopg://ci:isolated-ci-password@127.0.0.1:5432/camera_eye_test
          SNAPKEY_REQUIRE_POSTGRES_TESTS: '1'
        run: |
          python -m compileall -q camera_service cloud_portal tools
          python -m pytest tests -q
          python test_production_package.py
      - name: Build tested production image
        run: >-
          docker build -f Dockerfile.cloud
          --label org.opencontainers.image.revision="$GITHUB_SHA"
          -t "camera-eye-portal:$GITHUB_SHA" .
      - name: Verify production image with isolated PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker rm -f camera-eye-ci-smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --name camera-eye-ci-smoke --network host \
            -e SNAPKEY_ENV=production \
            -e SNAPKEY_DATABASE_URL=postgresql+psycopg://ci:isolated-ci-password@127.0.0.1:5432/camera_ci \
            "camera-eye-portal:$GITHUB_SHA"
          healthy=false
          for attempt in {1..60}; do
            response=$(curl -fsS --max-time 3 http://127.0.0.1:8000/health 2>/dev/null || true)
            if [[ -n "$response" ]] && printf '%s' "$response" | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("status")=="ok" and d.get("service")=="snapkey-portal"' 2>/dev/null; then
              healthy=true
              break
            fi
            if ! docker inspect -f '{{.State.Running}}' camera-eye-ci-smoke 2>/dev/null | grep -qx true; then
              echo "Smoke container exited before becoming healthy"
              break
            fi
            sleep 2
          done
          if [[ "$healthy" != true ]]; then
            docker logs --tail 80 camera-eye-ci-smoke
            exit 1
          fi
          docker exec camera-eye-ci-smoke python -c 'import os; from sqlalchemy import create_engine,text; e=create_engine(os.environ["SNAPKEY_DATABASE_URL"]); c=e.connect(); assert c.execute(text("SELECT 1")).scalar()==1; c.close()'
          docker save "camera-eye-portal:$GITHUB_SHA" | gzip > "$RUNNER_TEMP/camera-eye-image.tar.gz"
      - name: Deploy exact tested image
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.CAMERA_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.CAMERA_DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.CAMERA_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.CAMERA_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Missing CAMERA_DEPLOY_HOST}"
          : "${DEPLOY_USER:?Missing CAMERA_DEPLOY_USER}"
          : "${DEPLOY_KEY:?Missing CAMERA_DEPLOY_SSH_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?Missing CAMERA_DEPLOY_KNOWN_HOSTS}"
          ssh_dir=$(mktemp -d)
          trap 'rm -rf -- "$ssh_dir"' EXIT
          chmod 700 "$ssh_dir"
          printf '%s\n' "$DEPLOY_KEY" > "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"
          bundle="$RUNNER_TEMP/camera-eye-release.tar.gz"
          mkdir -p "$RUNNER_TEMP/camera-eye-release"
          cp docker-compose.cloud.yml "$RUNNER_TEMP/camera-eye-release/docker-compose.cloud.yml"
          cp "$RUNNER_TEMP/camera-eye-image.tar.gz" "$RUNNER_TEMP/camera-eye-release/image.tar.gz"
          tar -C "$RUNNER_TEMP/camera-eye-release" -czf "$bundle" docker-compose.cloud.yml image.tar.gz
          ssh -T -i "$ssh_dir/key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "$DEPLOY_USER@$DEPLOY_HOST" "deploy $GITHUB_SHA" < "$bundle"
          echo "Deployed tested cloud commit $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
