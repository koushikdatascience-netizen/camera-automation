name: Cloud CI and deployment

on:
  pull_request:
  push:
    branches: [main, feat/camera-eye-live-view-ux]
  workflow_dispatch:

permissions:
  contents: read

# A newer push waits for the current deployment/rollback to finish.
concurrency:
  group: camera-eye-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      SNAPKEY_ENV: development
      SNAPKEY_DATABASE_URL: ''
      CAMERA_AUTOMATION_HOME: ${{ github.workspace }}/data/ci-edge
      CAMERA_AUTOMATION_CONFIG: ${{ github.workspace }}/data/ci-edge/missing.yaml
      SNAPKEY_PORTAL_DB: ${{ github.workspace }}/data/ci-portal.db
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install -r requirements-ci.txt
      - run: python -m compileall -q camera_service cloud_portal tools
      - run: node --check camera_service/web/static/station.js
      - run: node --check cloud_portal/static/js/main.js
      - run: python -m pytest tests -q
      - run: python test_production_package.py
      - name: Validate deployment script
        if: runner.os == 'Linux'
        run: |
          bash -n tools/deploy_cloud.sh
          bash tools/test_deploy.sh


  windows-installer:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          lfs: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install production and packaging dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Prepare offline InsightFace model bundle
        shell: pwsh
        run: |
          python -c "from insightface.app import FaceAnalysis; FaceAnalysis(name='buffalo_l', providers=['CPUExecutionProvider'])"
          $model = Join-Path $HOME ".insightface\models\buffalo_l"
          foreach ($name in @("det_10g.onnx", "w600k_r50.onnx")) {
            if (-not (Test-Path (Join-Path $model $name))) { throw "Missing InsightFace model: $name" }
          }
      - name: Ensure Inno Setup 6 is available
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
      - name: Build production Windows installer
        shell: pwsh
        run: .\packaging\windows\build_installer.ps1
      - name: Version installer and generate SHA256
        shell: pwsh
        run: |
          $short = $env:GITHUB_SHA.Substring(0, 12)
          $source = "dist\installer\MadhushalaCameraAISetup.exe"
          $versioned = "dist\installer\MadhushalaCameraAISetup-$short.exe"
          Copy-Item $source $versioned
          (Get-FileHash $versioned -Algorithm SHA256).Hash.ToLower() |
            Set-Content "dist\installer\MadhushalaCameraAISetup-$short.sha256"
          "Installer: MadhushalaCameraAISetup-$short.exe" >> $env:GITHUB_STEP_SUMMARY
          "Commit: $env:GITHUB_SHA" >> $env:GITHUB_STEP_SUMMARY
          "SHA256: $((Get-FileHash $versioned -Algorithm SHA256).Hash.ToLower())" >> $env:GITHUB_STEP_SUMMARY
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: camera-eye-windows-installer-${{ github.sha }}
          path: |
            dist/installer/MadhushalaCameraAISetup-*.exe
            dist/installer/MadhushalaCameraAISetup-*.sha256
          if-no-files-found: error
          retention-days: 14

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/feat/camera-eye-live-view-ux'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: https://camera.snapkey.ai
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: isolated-ci-password
          POSTGRES_DB: camera_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d camera_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build the image for this tested commit
        run: >-
          docker build -f Dockerfile.cloud
          --label org.opencontainers.image.revision="$GITHUB_SHA"
          -t "camera-eye-portal:$GITHUB_SHA" .
      - name: Verify production image with isolated PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker rm -f camera-eye-ci-smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --name camera-eye-ci-smoke --network host \
            -e SNAPKEY_ENV=production \
            -e SNAPKEY_DATABASE_URL=postgresql+psycopg://ci:isolated-ci-password@127.0.0.1:5432/camera_ci \
            "camera-eye-portal:$GITHUB_SHA"
          healthy=false
          for attempt in {1..60}; do
            if curl -fsS --max-time 3 http://127.0.0.1:8000/health | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("status")=="ok" and d.get("service")=="snapkey-portal"'; then
              healthy=true
              break
            fi
            sleep 2
          done
          if [[ "$healthy" != true ]]; then
            docker logs --tail 80 camera-eye-ci-smoke
            exit 1
          fi
          docker exec camera-eye-ci-smoke python -c 'import os; from sqlalchemy import create_engine,text; e=create_engine(os.environ["SNAPKEY_DATABASE_URL"]); c=e.connect(); assert c.execute(text("SELECT 1")).scalar()==1; c.close()'
          docker save "camera-eye-portal:$GITHUB_SHA" | gzip > "$RUNNER_TEMP/camera-eye-image.tar.gz"
      - name: Deploy the same tested image
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.CAMERA_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.CAMERA_DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.CAMERA_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.CAMERA_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Missing CAMERA_DEPLOY_HOST}"
          : "${DEPLOY_USER:?Missing CAMERA_DEPLOY_USER}"
          : "${DEPLOY_KEY:?Missing CAMERA_DEPLOY_SSH_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?Missing CAMERA_DEPLOY_KNOWN_HOSTS}"
          ssh_dir=$(mktemp -d)
          trap 'rm -rf -- "$ssh_dir"' EXIT
          chmod 700 "$ssh_dir"
          printf '%s\n' "$DEPLOY_KEY" > "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"
          ssh -T -i "$ssh_dir/key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "$DEPLOY_USER@$DEPLOY_HOST" "deploy $GITHUB_SHA" < "$RUNNER_TEMP/camera-eye-image.tar.gz"
          echo "Deployed tested commit $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
