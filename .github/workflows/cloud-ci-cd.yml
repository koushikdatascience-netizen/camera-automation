name: Camera Eye CI

on:
  pull_request:
  push:
    branches: [main, feat/camera-eye-live-view-ux]

permissions:
  contents: read

concurrency:
  group: camera-eye-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: isolated-ci-password
          POSTGRES_DB: camera_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d camera_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PYTHONUTF8: '1'
      SNAPKEY_ENV: development
      SNAPKEY_DATABASE_URL: ''
      SNAPKEY_TEST_DATABASE_URL: postgresql+psycopg://ci:isolated-ci-password@127.0.0.1:5432/camera_eye_test
      SNAPKEY_REQUIRE_POSTGRES_TESTS: '1'
      CAMERA_AUTOMATION_HOME: ${{ github.workspace }}/data/ci-edge
      CAMERA_AUTOMATION_CONFIG: ${{ github.workspace }}/data/ci-edge/missing.yaml
      SNAPKEY_PORTAL_DB: ${{ github.workspace }}/data/ci-portal.db
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install -r requirements-ci.txt
      - name: Create disposable PostgreSQL integration database
        run: |
          python - <<'PY'
          from sqlalchemy import create_engine, text
          engine = create_engine("postgresql+psycopg://ci:isolated-ci-password@127.0.0.1:5432/camera_ci")
          with engine.connect().execution_options(isolation_level="AUTOCOMMIT") as connection:
              connection.execute(text("CREATE DATABASE camera_eye_test"))
          engine.dispose()
          PY
      - run: python -m compileall -q camera_service cloud_portal tools
      - run: python -m pytest tests -q
      - run: python test_production_package.py

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      SNAPKEY_ENV: development
      SNAPKEY_DATABASE_URL: ''
      CAMERA_AUTOMATION_HOME: ${{ github.workspace }}/data/ci-edge
      CAMERA_AUTOMATION_CONFIG: ${{ github.workspace }}/data/ci-edge/missing.yaml
      SNAPKEY_PORTAL_DB: ${{ github.workspace }}/data/ci-portal.db
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install -r requirements-ci.txt
      - run: python -m compileall -q camera_service cloud_portal tools
      - run: node --check camera_service/web/static/station.js
      - run: node --check cloud_portal/static/js/main.js
      - run: python -m pytest tests -q
      - run: python test_production_package.py
      - name: Validate deployment script
        if: runner.os == 'Linux'
        run: |
          bash -n tools/deploy_cloud.sh
          bash tools/test_deploy.sh
