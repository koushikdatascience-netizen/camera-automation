store_id: client-shop-01
database_path: data/camera_automation.db
evidence_dir: data/evidence
yolo_model: yolo11m.pt
features:
  attendance: false
  face_recognition: false
  unknown_detection: false
  unknown_person_detection: false
  shoplifting: false
  shoplifting_detection: false
  object_security: true
object_security:
  enabled: true
  object_classes:
    - scissors
  model_storage_dir: data/models/object_security
  inference:
    imgsz: 960
    confidence: 0.55
  roi:
    enabled: false
  tiling:
    enabled: false
    tile_size: 640
    overlap: 0.20
  confirmation:
    enabled: true
    window_frames: 5
    required_hits: 2
    minimum_confidence: 0.45
  alert:
    beep_enabled: true
    beep_frequency: 880
    beep_duration_ms: 400
    cooldown_seconds: 15
    save_snapshot: true
edge:
  edge_id: edge-client-shop-01
  tenant_id: tenant-demo
  site_id: client-shop-01
  activation_required: false
  activation_token: ""
  plan: demo
  license_cache_path: data/license_cache.json
  license_public_key: ""
cloud_sync:
  enabled: false
  base_url: https://your-platform.example.com
  api_token: CHANGE_ME
  timeout_seconds: 10
  batch_size: 50
  interval_seconds: 15
alerts:
  whatsapp_enabled: false
  whatsapp_recipients:
    - "+910000000000"
  send_unknown_inside: true
  send_crowd_alerts: true
  send_long_break_alerts: true
evidence:
  snapshot_enabled: true
  clip_enabled: false
  pre_event_seconds: 30
  post_event_seconds: 30
recognition:
  known_threshold: 0.55
  required_known_observations: 2
  minimum_face_quality: 0.25
  unknown_confirmation_seconds: 3
  max_recognition_attempts: 5
  known_recheck_seconds: 2
cameras:
  - camera_id: entrance_01
    name: Entrance Camera
    source_type: rtsp
    source: rtsp://USER:PASS@192.168.1.2:554/Streaming/Channels/102
    enabled: false
    camera_role: ENTRANCE_EXIT
    camera_zone: inside
    crowd_threshold: 10
    features:
      face_recognition: true
      attendance: true
      unknown_detection: true
      shoplifting: false
    attendance_line:
      x1: 100
      y1: 400
      x2: 900
      y2: 400
      inside_side: positive
      min_crossing_displacement_px: 25
