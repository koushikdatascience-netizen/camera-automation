services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-snapkey_vision}
      POSTGRES_USER: ${POSTGRES_USER:-snapkey}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - vision_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-snapkey} -d ${POSTGRES_DB:-snapkey_vision}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [vision]

  portal:
    build:
      context: .
      dockerfile: Dockerfile.cloud
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SNAPKEY_ENV: production
      SNAPKEY_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-snapkey}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-snapkey_vision}
      SNAPKEY_EDGE_API_TOKEN: ${SNAPKEY_EDGE_API_TOKEN:-}
      SNAPKEY_CRM_INTEGRATION_KEY: ${SNAPKEY_CRM_INTEGRATION_KEY:?set SNAPKEY_CRM_INTEGRATION_KEY}
      SNAPKEY_CRM_API_BASE_URL: ${SNAPKEY_CRM_API_BASE_URL:-https://apis.snapkey.in}
      SNAPKEY_CRM_API_TOKEN: ${SNAPKEY_CRM_API_TOKEN:-}
      # Automatic camera attendance posts the current face crop to the CRM
      # face-login service. Override this while that service is hosted separately.
      SNAPKEY_CRM_FACE_LOGIN_URL: ${SNAPKEY_CRM_FACE_LOGIN_URL:-https://apis.snapkey.in/api/Auth/loginUsingFaceTenant}
      # Auto-logout stays disabled until its business rule is explicitly confirmed.
      SNAPKEY_CRM_AUTO_LOGIN_ENABLED: ${SNAPKEY_CRM_AUTO_LOGIN_ENABLED:-1}
      SNAPKEY_CRM_AUTO_LOGOUT_ENABLED: ${SNAPKEY_CRM_AUTO_LOGOUT_ENABLED:-0}
      SNAPKEY_PUBLIC_BASE_URL: ${SNAPKEY_PUBLIC_BASE_URL:-https://camera.snapkey.ai}
      SNAPKEY_LIVEKIT_URL: ${SNAPKEY_LIVEKIT_URL:-wss://livekit.snapkeystudio.com}
      SNAPKEY_LIVEKIT_API_KEY: ${SNAPKEY_LIVEKIT_API_KEY:-}
      SNAPKEY_LIVEKIT_API_SECRET: ${SNAPKEY_LIVEKIT_API_SECRET:-}
      SNAPKEY_EDGE_ACTIVATION_CODE: ${SNAPKEY_EDGE_ACTIVATION_CODE:?set SNAPKEY_EDGE_ACTIVATION_CODE}
      SNAPKEY_LICENSE_PRIVATE_KEY: ${SNAPKEY_LICENSE_PRIVATE_KEY:?set SNAPKEY_LICENSE_PRIVATE_KEY}
      SNAPKEY_LICENSE_PUBLIC_KEY: ${SNAPKEY_LICENSE_PUBLIC_KEY:?set SNAPKEY_LICENSE_PUBLIC_KEY}
      SNAPKEY_PORTAL_SESSION_TTL_MINUTES: ${SNAPKEY_PORTAL_SESSION_TTL_MINUTES:-60}
      SNAPKEY_EVIDENCE_ROOT: /app/data/evidence
      SNAPKEY_UPDATE_ROOT: /app/data/updates
      SNAPKEY_UPDATE_PUBLISH_KEY: ${SNAPKEY_UPDATE_PUBLISH_KEY:-}
      SNAPKEY_MODEL_ROOT: /app/data/models
      SNAPKEY_MODEL_PUBLISH_KEY: ${SNAPKEY_MODEL_PUBLISH_KEY:-}
      # Cloud notifications. Keep provider secrets only in the server .env / secret store.
      SNAPKEY_SMTP_HOST: ${SNAPKEY_SMTP_HOST:-}
      SNAPKEY_SMTP_PORT: ${SNAPKEY_SMTP_PORT:-587}
      SNAPKEY_SMTP_USER: ${SNAPKEY_SMTP_USER:-}
      SNAPKEY_SMTP_PASSWORD: ${SNAPKEY_SMTP_PASSWORD:-}
      SNAPKEY_SMTP_FROM: ${SNAPKEY_SMTP_FROM:-}
      SNAPKEY_SMTP_STARTTLS: ${SNAPKEY_SMTP_STARTTLS:-1}
      SNAPKEY_WHATSAPP_PHONE_NUMBER_ID: ${SNAPKEY_WHATSAPP_PHONE_NUMBER_ID:-}
      SNAPKEY_WHATSAPP_ACCESS_TOKEN: ${SNAPKEY_WHATSAPP_ACCESS_TOKEN:-}
      SNAPKEY_WHATSAPP_API_VERSION: ${SNAPKEY_WHATSAPP_API_VERSION:-v23.0}
    command: uvicorn cloud_portal.api:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - vision_evidence_data:/app/data/evidence
      - vision_update_data:/app/data/updates
      - vision_model_data:/app/data/models
      - vision_face_models:/root/.insightface
    networks: [vision]

volumes:
  vision_postgres_data:
  vision_evidence_data:
  vision_update_data:
  vision_model_data:
  vision_face_models:

networks:
  vision:
