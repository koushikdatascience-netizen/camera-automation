services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-snapkey_vision}
      POSTGRES_USER: ${POSTGRES_USER:-snapkey}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - vision_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-snapkey} -d ${POSTGRES_DB:-snapkey_vision}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [vision]

  portal:
    build:
      context: .
      dockerfile: Dockerfile.cloud
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SNAPKEY_ENV: production
      SNAPKEY_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-snapkey}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-snapkey_vision}
      SNAPKEY_EDGE_API_TOKEN: ${SNAPKEY_EDGE_API_TOKEN:-}
      SNAPKEY_CRM_INTEGRATION_KEY: ${SNAPKEY_CRM_INTEGRATION_KEY:?set SNAPKEY_CRM_INTEGRATION_KEY}
      SNAPKEY_CRM_API_BASE_URL: ${SNAPKEY_CRM_API_BASE_URL:-https://apis.snapkey.in}
      SNAPKEY_CRM_API_TOKEN: ${SNAPKEY_CRM_API_TOKEN:-}
      # Keep roster mutation disabled until the customer's LoginLogout payload
      # contract is smoke-tested against SnapKey CRM.
      SNAPKEY_CRM_ATTENDANCE_ENABLED: ${SNAPKEY_CRM_ATTENDANCE_ENABLED:-0}
      SNAPKEY_PUBLIC_BASE_URL: ${SNAPKEY_PUBLIC_BASE_URL:-https://camera.snapkey.ai}
      SNAPKEY_EDGE_ACTIVATION_CODE: ${SNAPKEY_EDGE_ACTIVATION_CODE:?set SNAPKEY_EDGE_ACTIVATION_CODE}
      SNAPKEY_LICENSE_PRIVATE_KEY: ${SNAPKEY_LICENSE_PRIVATE_KEY:?set SNAPKEY_LICENSE_PRIVATE_KEY}
      SNAPKEY_LICENSE_PUBLIC_KEY: ${SNAPKEY_LICENSE_PUBLIC_KEY:?set SNAPKEY_LICENSE_PUBLIC_KEY}
      SNAPKEY_PORTAL_SESSION_TTL_MINUTES: ${SNAPKEY_PORTAL_SESSION_TTL_MINUTES:-60}
      SNAPKEY_EVIDENCE_ROOT: /app/data/evidence
    command: uvicorn cloud_portal.api:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - vision_evidence_data:/app/data/evidence
    networks: [vision]

volumes:
  vision_postgres_data:
  vision_evidence_data:

networks:
  vision:
